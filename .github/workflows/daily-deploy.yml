# 每日自动抓取并部署到 EdgeOne Pages
#
# 流程：cron 定时 → 装 Python → 跑 pack.py --fetch → 校验 → 上传 CDN
# 成本：公共仓库 Actions 免费额度无限，EdgeOne Pages 免费计划永久有效
#
# 需要在仓库 Settings → Secrets and variables → Actions 配置：
#   EDGEONE_API_TOKEN  —— EdgeOne 控制台「API Token」页创建（必填）
#   EDGEONE_SITE_NAME  —— 项目名，不填则用 intel-board（可选）
#
# 区域由Token 自带；EDGEONE_AREA 仅在需要显式指定时生效：
#   global=国际版（邮箱注册，免备案） / overseas=海外 / china=国内版（需实名）
#
# 详细说明见 DEPLOY-international.md
name: 每日情报看板更新

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions 用 UTC，北京时间 9:00 = UTC 1:00
    # 注释：每天 09:00 CST
    - cron: '0 1 * * *'
  workflow_dispatch:   # 支持手动触发

permissions:
  contents: read

concurrency:
  group: intel-board-deploy
  cancel-in-progress: false    # 上一轮没跑完就别打断，避免部署半成品

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 站点名固定为 EdgeOne 上实际存在的项目名。
      # 不再从 EDGEONE_SITE_NAME 读取——Secret 未配置时会落到默认值
      # intel-board，与真实项目名不符导致部署失败。
      SITE_NAME: aihot-intel-board
      # 加速区域：global=国际版（邮箱注册免备案）/ overseas=海外 / china=国内版
      # 令牌自带区域信息，此项仅在需要显式指定时覆盖
      EDGEONE_AREA: global

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 脚本全用标准库（curl / json / xml.etree），无需任何 pip 安装。
      # Ubuntu runner 自带 curl；缺失时补装。
      - name: 确认 curl 可用
        run: |
          which curl || (sudo apt-get update && sudo apt-get install -y curl)

      - name: 缓存 EdgeOne CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: edgeone-cli-${{ runner.os }}-${{ hashFiles('.github/workflows/daily-deploy.yml') }}
          restore-keys: edgeone-cli-${{ runner.os }}-

      - name: 校验 CLI 可用（早期失败能立刻发现问题）
        run: npx --yes edgeone@latest --version

      - name: 抓取数据并打包
        run: python pack.py --fetch

      # 打包失败必须阻断部署：宁可让线上保持旧版本，也不要发布空页面
      - name: 校验产物
        run: |
          set -e
          test -f aihot-intel.html || { echo "::error::未生成 aihot-intel.html"; exit 1; }
          SIZE=$(wc -c < aihot-intel.html)
          echo "产物体积：$SIZE 字节"
          if [ "$SIZE" -lt 20000 ]; then
            echo "::error::产物过小（$SIZE 字节），抓取可能失败"
            exit 1
          fi
          # 快照条目数校验。用 python -c 而非 heredoc：
          # heredoc 在 YAML 块标量里会因缩进层级出错，单行更可靠。
          if ! python -c "import json,sys; s=json.load(open('data/refreshed.json',encoding='utf-8')); n=len(s); f=sum(1 for x in s if x.get('feed')); print(f'快照 {n} 条（其中国内 RSS {f} 条）'); sys.exit(0 if n>=50 else 1)"; then
            echo "::error::快照条目不足 50，抓取可能失败"
            exit 1
          fi

      # 只上传 HTML —— 源码（pack.py / core.js 等）没有部署必要，
      # 同时避免把抓取脚本暴露在公开站点上
      - name: 准备部署目录
        run: |
          mkdir -p dist
          cp aihot-intel.html dist/index.html
          ls -la dist/

      - name: 部署到 EdgeOne Pages
        env:
          EDGEONE_API_TOKEN: ${{ secrets.EDGEONE_API_TOKEN }}
        run: |
          # Secrets 缺失时的提前诊断：不打印密钥值，只报告长度与存在性。
          if [ -z "${EDGEONE_API_TOKEN:-}" ]; then
            echo "::error::环境变量 EDGEONE_API_TOKEN 为空——仓库 Secrets 未配置或名称拼写不一致"
            echo "请在 Settings → Secrets and variables → Actions 中确认存在 EDGEONE_API_TOKEN"
            exit 1
          fi
          echo "Token 已注入，长度 ${#EDGEONE_API_TOKEN} 字符，前缀 ${EDGEONE_API_TOKEN:0:1}"

          set -o pipefail
          # 不用 --json：CLI 在不同环境下JSON 行为不一致（--json 与装饰日志
          # 混杂、退出码被 tee 吞掉）。文本模式输出更稳定。
          npx --yes edgeone@latest makers deploy ./dist \
            -n "$SITE_NAME" \
            -t "$EDGEONE_API_TOKEN" \
            -a "$EDGEONE_AREA" \
            -e production \
            2>&1 | tee deploy-output.log
          CODE=${PIPESTATUS[0]}
          echo "CLI 退出码: $CODE"
          {
            echo "### EdgeOne 部署原始输出"
            echo ""
            echo "- 站点名: $SITE_NAME"
            echo "- 区域: $EDGEONE_AREA"
            echo "- Token 长度: ${#EDGEONE_API_TOKEN}"
            echo "- CLI 退出码: $CODE"
            echo ""
            echo '```'
            cat deploy-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $CODE

      - name: 解析部署结果
        if: always()
        run: |
          if [ ! -f deploy-output.log ]; then
            echo "::error::未拿到部署输出文件"
            exit 1
          fi
          # 解析逻辑放在 tools/parse_deploy.py，不内联在 YAML 里——
          # 多行 Python 写在块标量中会因缩进层级出错，且难以调试。
          python tools/parse_deploy.py

      - name: 记录摘要
        if: always()
        run: |
          URL="$(cat DEPLOY_URL 2>/dev/null || echo '（部署未成功）')"
          N=$(python -c "import json;print(len(json.load(open('data/refreshed.json',encoding='utf-8'))))" 2>/dev/null || echo '?')
          RSS=$(python -c "import json;print(sum(1 for x in json.load(open('data/refreshed.json',encoding='utf-8')) if x.get('feed')))" 2>/dev/null || echo '?')
          {
            echo "### 情报看板更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| 指标 | 值 |"
            echo "|---|---|"
            echo "| 快照条目 | $N |"
            echo "| 其中国内 RSS | $RSS |"
            echo "| 产物体积 | $(wc -c < aihot-intel.html) 字节 |"
            echo "| 访问地址 | $URL |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 无论成败都上传日志，避免只能靠管理员权限进日志页排查
      - name: 上传部署日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deploy-logs
          path: |
            deploy-output.log
            DEPLOY_URL
          if-no-files-found: ignore
