# 每日自动抓取并部署到 EdgeOne Pages
#
# 流程：cron 定时 / push 触发 → 装 Python → 跑 pack.py --fetch → 校验 → 上传 CDN
# 成本：公共仓库 Actions 免费额度无限，EdgeOne Pages 免费计划永久有效
#
# 前置条件：仓库 Settings → Secrets and variables → Actions 中存在名为
#   BOARD 的 Secret，值为 EdgeOne 控制台「API Token」页创建的令牌。
#   ⚠️ 变量名必须严格为 BOARD（全大写、无空格）。GitHub 对不存在的 Secret
#   会静默返回空字符串，不报错——这个坑曾导致连续多次部署失败。
#
# 站点名固定 aihot-intel-board（EdgeOne 上的实际项目名），
# 加速区域 global（国际版，邮箱注册免备案）。
#
# 详细说明见 DEPLOY-international.md
name: 每日情报看板更新

on:
  push:
    branches: [main]
  schedule:
    # GitHub Actions 用 UTC，北京时间 9:00 = UTC 1:00
    # 注释：每天 09:00 CST
    - cron: '0 1 * * *'
  workflow_dispatch:   # 支持手动触发

# 只需读权限：检出代码 + 运行脚本，不写回仓库
permissions:
  contents: read

concurrency:
  group: intel-board-deploy
  cancel-in-progress: false    # 上一轮没跑完就别打断，避免部署半成品

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 站点名固定为 EdgeOne 上实际存在的项目名。
      # 不再从 EDGEONE_SITE_NAME 读取——Secret 未配置时会落到默认值
      # intel-board，与真实项目名不符导致部署失败。
      SITE_NAME: aihot-intel-board
      # 加速区域：global=国际版（邮箱注册免备案）/ overseas=海外 / china=国内版
      # 令牌自带区域信息，此项仅在需要显式指定时覆盖
      EDGEONE_AREA: global

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 脚本全用标准库（curl / json / xml.etree），无需任何 pip 安装。
      # Ubuntu runner 自带 curl；缺失时补装。
      - name: 确认 curl 可用
        run: |
          which curl || (sudo apt-get update && sudo apt-get install -y curl)

      - name: 缓存 EdgeOne CLI
        uses: actions/cache@v4
        with:
          path: ~/.npm/_npx
          key: edgeone-cli-${{ runner.os }}-${{ hashFiles('.github/workflows/daily-deploy.yml') }}
          restore-keys: edgeone-cli-${{ runner.os }}-

      - name: 校验 CLI 可用（早期失败能立刻发现问题）
        run: npx --yes edgeone@latest --version

      - name: 抓取数据并打包
        run: python pack.py --fetch

      # 打包失败必须阻断部署：宁可让线上保持旧版本，也不要发布空页面
      - name: 校验产物
        run: |
          set -e
          test -f aihot-intel.html || { echo "::error::未生成 aihot-intel.html"; exit 1; }
          SIZE=$(wc -c < aihot-intel.html)
          echo "产物体积：$SIZE 字节"
          if [ "$SIZE" -lt 20000 ]; then
            echo "::error::产物过小（$SIZE 字节），抓取可能失败"
            exit 1
          fi
          # 快照条目数校验。用 python -c 而非 heredoc：
          # heredoc 在 YAML 块标量里会因缩进层级出错，单行更可靠。
          if ! python -c "import json,sys; s=json.load(open('data/refreshed.json',encoding='utf-8')); n=len(s); f=sum(1 for x in s if x.get('feed')); print(f'快照 {n} 条（其中国内 RSS {f} 条）'); sys.exit(0 if n>=50 else 1)"; then
            echo "::error::快照条目不足 50，抓取可能失败"
            exit 1
          fi

      # 只上传 HTML —— 源码（pack.py / core.js 等）没有部署必要，
      # 同时避免把抓取脚本暴露在公开站点上
      - name: 准备部署目录
        run: |
          mkdir -p dist
          cp aihot-intel.html dist/index.html
          ls -la dist/

      - name: 部署到 EdgeOne Pages
        env:
          # Secret 实际名为 BOARD（用户创建时用的名字）
          EDGEONE_API_TOKEN: ${{ secrets.BOARD }}
        run: |
          # Secrets 缺失时的提前诊断：不打印密钥值，只报告长度与存在性。
          if [ -z "${EDGEONE_API_TOKEN:-}" ]; then
            echo "::error title=缺少仓库 Secret::本工作流读取的 Secret 名为 BOARD，请在 Settings → Secrets and variables → Actions 中确认该 Secret 已存在"
            echo "::error file=secrets::变量名必须严格为 BOARD（全大写，无空格）"
            exit 1
          fi
          echo "Token 已注入，长度 ${#EDGEONE_API_TOKEN} 字符，前缀 ${EDGEONE_API_TOKEN:0:1}"
          # 用 error 级别把环境信息推到 API 可读的annotations，绕开日志页权限
          echo "::debug name=env::node=$(node -v) npm=$(npm -v) cwd=$(pwd) dist=$(ls dist 2>&1) size=$(wc -c < dist/index.html 2>&1)"

          set -o pipefail
          # 不用 --json：CLI 在不同环境下JSON 行为不一致（--json 与装饰日志
          # 混杂、退出码被 tee 吞掉）。文本模式输出更稳定。
          npx --yes edgeone@latest makers deploy ./dist \
            -n "$SITE_NAME" \
            -t "$EDGEONE_API_TOKEN" \
            -a "$EDGEONE_AREA" \
            -e production \
            2>&1 | tee deploy-output.log
          CODE=${PIPESTATUS[0]}
          echo "CLI 退出码: $CODE"
          # 把 CLI 输出尾部通过 error 注解抛出——annotations 可经 API 匿名读取，
          # 而 Actions 日志页与 artifact 都需要权限，排查时读不到。
          {
            echo ""
            echo "### EdgeOne 部署原始输出"
            echo ""
            echo "- 站点名: $SITE_NAME"
            echo "- 区域: $EDGEONE_AREA"
            echo "- CLI 退出码: $CODE"
            echo ""
            echo '```'
            cat deploy-output.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$CODE" -ne 0 ]; then
            echo "::error title=EdgeOne 部署失败::退出码 $CODE；详见本步骤日志与 workflow summary"
            tail -5 deploy-output.log | while IFS= read -r l; do
              echo "::error file=deploy-output.log::${l}"
            done
          fi
          exit $CODE

      - name: 解析部署结果
        if: always()
        run: |
          if [ ! -f deploy-output.log ]; then
            echo "::error::未拿到部署输出文件"
            exit 1
          fi
          # 解析逻辑放在 tools/parse_deploy.py，不内联在 YAML 里——
          # 多行 Python 写在块标量中会因缩进层级出错，且难以调试。
          python tools/parse_deploy.py

      - name: 记录摘要
        if: always()
        run: |
          URL="$(cat DEPLOY_URL 2>/dev/null || echo '（部署未成功）')"
          N=$(python -c "import json;print(len(json.load(open('data/refreshed.json',encoding='utf-8'))))" 2>/dev/null || echo '?')
          RSS=$(python -c "import json;print(sum(1 for x in json.load(open('data/refreshed.json',encoding='utf-8')) if x.get('feed')))" 2>/dev/null || echo '?')
          {
            echo "### 情报看板更新 $(date -u '+%Y-%m-%d %H:%M UTC')"
            echo ""
            echo "| 指标 | 值 |"
            echo "|---|---|"
            echo "| 快照条目 | $N |"
            echo "| 其中国内 RSS | $RSS |"
            echo "| 产物体积 | $(wc -c < aihot-intel.html) 字节 |"
            echo "| 访问地址 | $URL |"
          } >> "$GITHUB_STEP_SUMMARY"

      # 无论成败都把关键信息写进 workflow summary——
      # Actions 日志页需管理员权限，artifact 需登录态，summary 最易读。
      - name: 诊断信息
        if: always()
        run: |
          {
            echo ""
            echo "### 排查信息"
            echo ""
            echo "- Node: $(node -v) / npm: $(npm -v)"
            echo "- 站点名: $SITE_NAME / 区域: $EDGEONE_AREA"
            if [ -f deploy-output.log ]; then
              echo "- CLI 输出行数: $(wc -l < deploy-output.log)"
              echo ""
              echo '```'
              tail -20 deploy-output.log
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
